<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Nitrogen Junkie | Red Sea Diving Instructor — Marsa Alam, El Quseir & Sataya Dolphin Trips</title>
<meta name="description" content="Nitrogen Junkie — Omar Sherif is a PADI diving instructor based in the Red Sea, Egypt. Guided dives, courses, boat trips and dolphin experiences across El Quseir, Port Ghalib and Marsa Alam." />
<meta name="keywords" content="Nitrogen Junkie, Red Sea diving instructor, Marsa Alam diving, PADI instructor Egypt, Sataya dolphin trip, El Quseir diving, Port Ghalib diving, Red Sea boat trips, Elphinstone shark dive, Salem Express wreck dive" />

<!-- TODO: replace YOUR-DOMAIN-HERE with the site's real domain once you have
     a custom domain (or the final Vercel production URL) set up. -->
<link rel="canonical" href="https://YOUR-DOMAIN-HERE.com/" />

<!-- Open Graph -->
<meta property="og:title" content="Nitrogen Junkie | Red Sea Diving Instructor" />
<meta property="og:description" content="PADI diving instructor based in the Red Sea, Egypt. Guided dives, courses, boat trips and dolphin experiences across El Quseir, Port Ghalib and Marsa Alam." />
<meta property="og:type" content="website" />
<meta property="og:locale" content="en_US" />
<meta property="og:image" content="assets/img/hero.jpg" />
<meta property="og:url" content="https://YOUR-DOMAIN-HERE.com/" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Nitrogen Junkie | Red Sea Diving Instructor" />
<meta name="twitter:description" content="PADI diving instructor based in the Red Sea, Egypt. Guided dives, courses, boat trips and dolphin experiences." />
<meta name="twitter:image" content="assets/img/hero.jpg" />

<!-- Structured data — helps Google understand who Omar is and what he
     offers, and can unlock richer search results (name, image, social
     links) beyond a plain blue link. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Omar Sherif",
  "alternateName": "Nitrogen Junkie",
  "jobTitle": "PADI Diving Instructor",
  "description": "PADI diving instructor based in the Red Sea, Egypt, offering guided dives, courses, boat trips and dolphin experiences across El Quseir, Port Ghalib and Marsa Alam.",
  "image": "assets/img/portrait.jpg",
  "email": "mailto:omar.sheriff182@gmail.com",
  "sameAs": ["https://www.instagram.com/nitrogen.junkiee"],
  "areaServed": {
    "@type": "Place",
    "name": "Red Sea, Egypt"
  },
  "knowsAbout": ["Scuba Diving", "PADI Diving Instruction", "Dolphin Tours", "Wreck Diving", "Shark Diving"]
}
</script>

<link rel="icon" type="image/png" href="assets/img/favicon-32.png" />
<link rel="apple-touch-icon" href="assets/img/favicon-512.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="styles.css" />
</head>
<body>


<!-- Custom cursor -->
<div class="cursor" id="cursor" aria-hidden="true"><span id="cursorLabel"></span></div>

<!-- Nav -->
<header class="nav" id="nav">
  <a class="nav__mark" href="#top">
    <img src="assets/img/logo.png" alt="Nitrogen Junkie logo" class="nav__logo-img" />
    <span>NITROGEN JUNKIE</span>
  </a>
  <button class="nav__toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks">
    <span></span><span></span><span></span>
  </button>
  <nav class="nav__links" id="navLinks" aria-label="Primary"></nav>
</header>

<!-- Depth gauge (signature element) -->
<aside class="gauge" aria-hidden="true">
  <span class="gauge__label" id="gaugeLabel">SURFACE</span>
  <div class="gauge__track" id="gaugeTrack">
    <div class="gauge__fill" id="gaugeFill"></div>
    <div class="gauge__marker" id="gaugeMarker" style="top:0%"></div>
  </div>
</aside>

<!-- Floating Instagram contact button -->
<a class="insta-float" id="instaFloat" href="#" target="_blank" rel="noopener" aria-label="Message on Instagram">
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.6"/>
    <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6"/>
    <circle cx="17.4" cy="6.6" r="1.1" fill="currentColor"/>
  </svg>
  <span>Instagram</span>
</a>

<main id="top">

  <!-- HERO -->
  <section class="hero" id="hero">
    <div class="hero__media" id="heroMedia"></div>
    <div class="hero__scrim"></div>
    <div class="hero__content">
      <span class="eyebrow hero__eyebrow" id="heroEyebrow"></span>
      <h1 class="hero__title" id="heroTitle"></h1>
      <p class="hero__subtitle" id="heroSubtitle"></p>
      <div class="hero__ctas" id="heroCtas"></div>
    </div>
    <div class="hero__depth">
      <span class="hero__depth-label" id="heroDepthLabel"></span>
      <span class="hero__depth-indicator"></span>
    </div>
  </section>

  <!-- INTRO -->
  <section class="section section--dark" id="intro">
    <div class="container">
      <div class="intro__grid">
        <div class="intro__copy reveal">
          <span class="eyebrow" id="introEyebrow"></span>
          <div id="introLines"></div>
        </div>
        <div class="intro__media-stack">
          <div class="intro__portrait reveal" id="introPortrait"></div>
          <div class="intro__underwater reveal reveal-delay-2" id="introUnderwater"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- JOURNEY -->
  <section class="section section--deep" id="experience">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow" id="journeyEyebrow"></span>
        <h2 class="display-2" id="journeyTitle"></h2>
      </div>
      <div class="journey__list" id="journeyList"></div>
    </div>
  </section>

  <!-- EXPERIENCES -->
  <section class="section section--dark" id="experiences">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow" id="experiencesEyebrow"></span>
        <h2 class="display-2" id="experiencesTitle"></h2>
      </div>
      <div class="experiences__list" id="experiencesList"></div>
    </div>
  </section>

  <!-- DESTINATIONS -->
  <section class="section section--deep" id="destinations">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow" id="destinationsEyebrow"></span>
        <h2 class="display-2" id="destinationsTitle"></h2>
      </div>
      <div class="destinations__grid" id="destinationsGrid"></div>
    </div>
  </section>

  <!-- SPECIAL EXPERIENCES -->
  <section id="special" aria-label="Special Experiences">
    <div class="container" style="padding-top: var(--space-6);">
      <div class="section-head reveal">
        <span class="eyebrow" id="specialEyebrow"></span>
        <h2 class="display-2" id="specialTitle"></h2>
      </div>
    </div>
    <div id="specialList"></div>
  </section>

  <!-- GALLERY -->
  <section class="section section--dark" id="gallery">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow" id="galleryEyebrow"></span>
        <h2 class="display-2" id="galleryTitle"></h2>
      </div>
      <div class="gallery__grid" id="galleryGrid"></div>
    </div>
  </section>

  <!-- JOURNAL -->
  <section class="section section--deep" id="journal">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow" id="journalEyebrow"></span>
        <h2 class="display-2" id="journalTitle"></h2>
      </div>
      <div class="journal__grid" id="journalGrid"></div>
    </div>
  </section>

  <!-- TESTIMONIALS -->
  <section class="section section--dark" id="testimonials">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow" id="testimonialsEyebrow"></span>
        <h2 class="display-2" id="testimonialsTitle"></h2>
      </div>
      <div class="testimonials__grid" id="testimonialsGrid"></div>
    </div>
  </section>

  <!-- CONNECTION -->
  <section class="connection" id="connection">
    <canvas class="connection__particles" id="connectionCanvas" aria-hidden="true"></canvas>
    <div class="connection__content reveal">
      <h2 class="connection__title" id="connectionTitle"></h2>
      <div class="connection__lines" id="connectionLines"></div>
    </div>
  </section>

  <!-- FINAL CTA -->
  <section class="final-cta" id="contact">
    <div class="container">
      <span class="eyebrow final-cta__eyebrow reveal" id="finalEyebrow"></span>
      <h2 class="final-cta__title reveal" id="finalTitle"></h2>
      <p class="body-lg final-cta__copy reveal" id="finalCopy"></p>
      <div class="final-cta__ctas reveal" id="finalCtas"></div>
    </div>
  </section>

</main>

<!-- FOOTER -->
<footer class="footer">
  <div>
    <div class="footer__brand">
      <img src="assets/img/logo.png" alt="Nitrogen Junkie logo" class="footer__logo-img" />
      <div class="footer__mark" id="footerMark"></div>
    </div>
    <div class="footer__tagline" id="footerTagline"></div>
    <div class="footer__location" id="footerLocation"></div>
  </div>
  <div class="footer__links" id="footerLinks"></div>
  <div class="footer__copyright" id="footerCopyright"></div>
</footer>

<!-- Gallery lightbox — opens any gallery photo full-size -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox__close" id="lightboxClose" aria-label="Close">&times;</button>
  <figure class="lightbox__figure">
    <img class="lightbox__img" id="lightboxImg" src="" alt="" />
    <figcaption class="lightbox__caption" id="lightboxCaption"></figcaption>
  </figure>
</div>

<script src="content.js"></script>
<script src="media.js"></script>
<script src="script.js"></script>
</body>
</html>
